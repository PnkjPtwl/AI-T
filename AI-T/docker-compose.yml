# =============================================================================
# docker-compose.yml — SalesCoach Demo Deployment
# No IAM role required — secrets are passed as env vars, logs use json-file
# =============================================================================
version: '3.8'

services:
  # ── Backend Service (Express) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salescoach-backend
    restart: unless-stopped
    expose:
      - "4000"  # Exposed to Docker network, NOT to host
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ALLOWED_ORIGIN=13.50.236.160
      - RAG_API_URL=http://rag-api:8001
      # Secrets — passed directly (no Secrets Manager / IAM role needed)
      - SUPABASE_URL=https://pcgsizytsqayyidriyfu.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjZ3Npenl0c3FheXlpZHJpeWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNTQzMjQsImV4cCI6MjA5ODczMDMyNH0.VIUJ5-lZ2Nh-rW5DPLlGbVAw3QjYnKvG5U-fYWPndLc
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjZ3Npenl0c3FheXlpZHJpeWZ1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MzE1NDMyNCwiZXhwIjoyMDk4NzMwMzI0fQ.1n-eMaJmJKDV6BQ0HSNzXvDo6ACnzxRVrWXkqSbkCCA
      - GROQ_API_KEY=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
      - ASSEMBLYAI_API_KEY=3183626f7af647edbc0c45cc4566cdfd
      - ELEVENLABS_API_KEY=sk_cad715d54bdb1a0a307651b4d6fc43f8bbc60d3d72c69c8f
      - ELEVENLABS_VOICE_ID_MALE=pNInz6obpgDQGcFmaJgB
      - ELEVENLABS_VOICE_ID_FEMALE=EXAVITQu4vr4xnSDxMaL
      - DEEPGRAM_API_KEY=8a0e8df64fbaabaf8d67e21792b7de1ebb845273
    depends_on:
      - rag-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── RAG API Service (Python FastAPI) ──────────────────────────────────────────
  rag-api:
    build:
      context: ./
      dockerfile: ./rag/Dockerfile
    container_name: salescoach-rag-api
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - SUPABASE_URL=https://pcgsizytsqayyidriyfu.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjZ3Npenl0c3FheXlpZHJpeWZ1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MzE1NDMyNCwiZXhwIjoyMDk4NzMwMzI0fQ.1n-eMaJmJKDV6BQ0HSNzXvDo6ACnzxRVrWXkqSbkCCA
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2048M  # Needs ~1.5GB for embedding + reranker models
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s  # Models take ~30s to load on first start


  # ── Frontend Service (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://13.50.236.160
    container_name: salescoach-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Reverse Proxy (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: salescoach-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
