# =============================================================================
# docker-compose.yml — SalesCoach Demo Deployment
# Secrets are NOT stored here — they are loaded from a .env file on the server.
# Copy .env to EC2 via SCP. See deployment guide for instructions.
# =============================================================================
version: '3.8'

services:
  # ── Backend Service (Express) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salescoach-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ALLOWED_ORIGIN=${EC2_IP}
      - RAG_API_URL=http://rag-api:8001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID_MALE=${ELEVENLABS_VOICE_ID_MALE}
      - ELEVENLABS_VOICE_ID_FEMALE=${ELEVENLABS_VOICE_ID_FEMALE}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
    depends_on:
      - rag-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── RAG API Service (Python FastAPI) ──────────────────────────────────────────
  rag-api:
    build:
      context: ./
      dockerfile: ./rag/Dockerfile
    container_name: salescoach-rag-api
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  # ── Frontend Service (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://${EC2_IP}
    container_name: salescoach-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Reverse Proxy (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: salescoach-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
